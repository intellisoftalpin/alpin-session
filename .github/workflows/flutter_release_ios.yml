name: Release Flutter App to App Store

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:
    # inputs:
    #   reason:
    #     description: "Manual run reason"
    #     required: true
    #     default: "Triggered manually"

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, isa]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Flutter clean
        run: flutter clean

      - name: Clean Xcode DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Flutter pub get
        run: flutter pub get
