name: session_app
description: "Alpin Session - Privacy-focused messenger"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Rust bridge
  rust_lib_session_app:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Database
  drift: ^2.24.0
  sqlcipher_flutter_libs: ^0.6.6

  # Storage
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # UI
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  drift_dev: ^2.24.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
